<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>
    <linearGradient id="neon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00e5ff"/>
      <stop offset="50%" stop-color="#9d4edd"/>
      <stop offset="100%" stop-color="#f72585"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffb703"/>
      <stop offset="100%" stop-color="#fb8500"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Hintergrund mit abgerundeten Ecken -->
  <rect width="512" height="512" rx="110" fill="url(#bg)"/>
  <rect width="504" height="504" x="4" y="4" rx="106" fill="none" stroke="url(#neon)" stroke-width="8" opacity="0.6"/>

  <!-- Blitz / Sparkle im Hintergrund -->
  <path d="M 270 50 L 170 260 L 250 260 L 220 460 L 350 230 L 270 230 Z" fill="url(#gold)" filter="url(#glow)" opacity="0.85"/>

  <!-- 1 x 1 Text -->
  <text x="256" y="295" font-family="-apple-system, system-ui, sans-serif" font-size="130" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="4" filter="url(#glow)">1×1</text>
  
  <!-- Arcade Badge -->
  <rect x="146" y="340" width="220" height="48" rx="24" fill="#00e5ff" opacity="0.9"/>
  <text x="256" y="373" font-family="-apple-system, system-ui, sans-serif" font-size="26" font-weight="900" fill="#04101e" text-anchor="middle" letter-spacing="3">ARCADE</text>
</svg>
